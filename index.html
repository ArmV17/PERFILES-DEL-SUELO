<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Placas QR - UAAAN</title>
  <script src="https://unpkg.com/easyqrcodejs/dist/easy.qrcode.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f4ede2;
      color: #333;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 40px 20px;
      margin: 0;
      flex-wrap: wrap;
    }

    /* Panel de controles */
    .panel-controles {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 350px;
      width: 100%;
      height: fit-content;
    }
    
    h2 { color: #2e5a44; margin-top: 0; text-align: center; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #555; }
    input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    
    button {
      width: 100%; padding: 12px; background-color: #2e5a44; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    button:hover { background-color: #203e2f; }
    
    .btn-descargar { background-color: #8b5a2b; display: none; margin-top: 15px; }
    .btn-descargar:hover { background-color: #6b4421; }

    /* Diseño de la Placa Física (Horizontal) */
    .panel-placa {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #placa-exportar {
      background: #ffffff;
      width: 550px; /* Placa más ancha */
      height: 240px; /* Altura fija */
      border: 4px solid #2e5a44; 
      border-radius: 12px;
      padding: 20px 25px;
      box-sizing: border-box;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      position: relative;
      display: flex;
      flex-direction: row; /* Divide en izquierda y derecha */
      align-items: center;
      justify-content: space-between;
    }

    /* Columna Izquierda (Logo y Textos) */
    .placa-izquierda {
      width: 60%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      text-align: left;
    }

    #logo-institucion {
      height: 55px; /* Tamaño del escudo */
      width: auto;
      margin-bottom: 12px;
      object-fit: contain;
    }

    .placa-izquierda h1 {
      font-size: 19px;
      margin: 0;
      color: #111;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .placa-izquierda h2 {
      font-size: 14px;
      margin: 4px 0 15px 0;
      color: #2e5a44;
      font-weight: 600;
    }

    .nombre-perfil {
      font-size: 15px;
      color: #222;
      font-weight: bold;
      margin: 0;
      padding-top: 12px;
      border-top: 2px solid #eaeaea;
      width: 100%;
    }

    /* Columna Derecha (Código QR) */
    .placa-derecha {
      width: 35%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-left: 2px dashed #eaeaea;
      padding-left: 15px;
    }

    #qr-container {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      min-height: 150px;
      min-width: 150px;
    }

    .instruccion {
      font-size: 12px;
      font-weight: bold;
      color: #c0392b; 
      margin: 10px 0 0 0;
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="panel-controles">
    <h2>Generador de Placas QR</h2>
    
    <div class="form-group">
      <label for="link">Enlace Directo de Vercel (URL)</label>
      <input type="text" id="link" placeholder="Ej: https://misitio.vercel.app/perfil1.html">
    </div>

    <div class="form-group">
      <label for="nombre">Ubicación / Nombre del Perfil</label>
      <input type="text" id="nombre" placeholder="Ej: Soto la Marina, Tamaulipas">
    </div>

    <div class="form-group">
      <label for="logo">Logo de la Institución (Izquierda)</label>
      <input type="file" id="logo" accept="image/png, image/jpeg">
      <span style="font-size: 11px; color: #888;">* Reemplaza el escudo de muestra.</span>
    </div>

    <button onclick="generarQR()">1. Actualizar Placa</button>
    <button id="btn-descargar" class="btn-descargar" onclick="descargarPlaca()">2. Descargar Placa (Alta Resolución)</button>
  </div>

  <div class="panel-placa">
    <p style="margin-top: 0; font-size: 14px; color: #555; font-weight: bold;">Vista Previa de la Placa Física</p>
    
    <div id="placa-exportar">
      
      <div class="placa-izquierda">
        <img id="logo-institucion" src="https://cdn-icons-png.flaticon.com/512/2942/2942784.png" alt="Escudo">
        
        <h1>U.A.A.A.N.</h1>
        <h2>Ciencias del Suelo</h2>
        <p class="nombre-perfil" id="texto-nombre">Nombre del Perfil</p>
      </div>

      <div class="placa-derecha">
        <div id="qr-container">
          <span style="color: #aaa; font-size: 12px;">[ Escanea ]</span>
        </div>
        <p class="instruccion">Escanea aquí</p>
      </div>

    </div>
  </div>

  <script>
    // Escuchar cuando se sube un logo para cambiar la imagen de la placa al instante
    document.getElementById('logo').addEventListener('change', function(event) {
      if (event.target.files && event.target.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('logo-institucion').src = e.target.result;
        };
        reader.readAsDataURL(event.target.files[0]);
      }
    });

    function generarQR() {
      const link = document.getElementById('link').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      const contenedorQR = document.getElementById('qr-container');
      const textoNombre = document.getElementById('texto-nombre');

      if (!link || !nombre) {
        alert("Por favor llena el enlace y el nombre del perfil.");
        return;
      }

      // Actualizar el texto
      textoNombre.innerText = nombre;

      // Limpiar y crear el QR con dimensiones ajustadas al nuevo lado derecho
      contenedorQR.innerHTML = "";
      new QRCode(contenedorQR, {
        text: link,
        width: 140,  /* Ajustado para el diseño rectangular */
        height: 140,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H 
      });

      document.getElementById('btn-descargar').style.display = 'block';
    }

    function descargarPlaca() {
      const placa = document.getElementById('placa-exportar');
      const nombre = document.getElementById('nombre').value.trim();

      html2canvas(placa, { scale: 3, backgroundColor: null }).then(canvas => {
        const a = document.createElement('a');
        a.href = canvas.toDataURL("image/png");
        a.download = 'Placa_QR_' + nombre.replace(/\s+/g, '_') + '.png';
        
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });
    }
  </script>

</body>
</html>
