<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Placas QR - UAAAN</title>
  <script src="https://unpkg.com/easyqrcodejs/dist/easy.qrcode.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f4ede2;
      color: #333;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 40px 20px;
      margin: 0;
      flex-wrap: wrap;
    }

    /* Panel de controles (Izquierda) */
    .panel-controles {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 350px;
      width: 100%;
      height: fit-content;
    }
    
    h2 { color: #2e5a44; margin-top: 0; text-align: center; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #555; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    
    button {
      width: 100%; padding: 12px; background-color: #2e5a44; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    button:hover { background-color: #203e2f; }
    
    .btn-descargar { background-color: #8b5a2b; display: none; margin-top: 15px; }
    .btn-descargar:hover { background-color: #6b4421; }

    /* Diseño de la Placa Física (Derecha) */
    .panel-placa {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #placa-exportar {
      background: #ffffff;
      width: 340px; /* Proporción ideal para ficha técnica */
      border: 4px solid #2e5a44; /* Borde institucional */
      border-radius: 16px;
      padding: 25px 20px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      position: relative;
    }

    .placa-header h1 {
      font-size: 16px;
      margin: 0;
      color: #111;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .placa-header h2 {
      font-size: 13px;
      margin: 5px 0 20px 0;
      color: #2e5a44;
      font-weight: normal;
    }

    #qr-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      min-height: 200px;
      align-items: center;
    }

    .placa-footer .instruccion {
      font-size: 14px;
      font-weight: bold;
      color: #c0392b; /* Acento rojo para llamar la atención */
      margin: 0 0 8px 0;
      text-transform: uppercase;
    }
    .placa-footer .nombre-perfil {
      font-size: 16px;
      color: #222;
      font-weight: bold;
      margin: 0;
      padding-top: 10px;
      border-top: 2px dashed #ccc;
    }
  </style>
</head>
<body>

  <div class="panel-controles">
    <h2>Generador de Placas QR</h2>
    
    <div class="form-group">
      <label for="link">Enlace Directo de Vercel (URL)</label>
      <input type="text" id="link" placeholder="Ej: https://misitio.vercel.app/perfil1.html">
    </div>

    <div class="form-group">
      <label for="nombre">Ubicación / Nombre del Perfil</label>
      <input type="text" id="nombre" placeholder="Ej: Soto la Marina, Tamaulipas">
    </div>

    <button onclick="generarQR()">1. Actualizar Placa</button>
    <button id="btn-descargar" class="btn-descargar" onclick="descargarPlaca()">2. Descargar Placa (Alta Resolución)</button>
  </div>

  <div class="panel-placa">
    <p style="margin-top: 0; font-size: 14px; color: #555; font-weight: bold;">Vista Previa de la Placa Física</p>
    
    <div id="placa-exportar">
      <div class="placa-header">
        <h1>U.A.A.A.N.</h1>
        <h2>Ciencias del Suelo</h2>
      </div>
      
      <div id="qr-container">
        <span style="color: #aaa; font-size: 12px;">[ QR ]</span>
      </div>

      <div class="placa-footer">
        <p class="instruccion">Escanea para explorar</p>
        <p class="nombre-perfil" id="texto-nombre">Nombre del Perfil</p>
      </div>
    </div>
  </div>

  <script>
    function generarQR() {
      const link = document.getElementById('link').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      const contenedorQR = document.getElementById('qr-container');
      const textoNombre = document.getElementById('texto-nombre');

      if (!link || !nombre) {
        alert("Por favor llena el enlace y el nombre del perfil.");
        return;
      }

      // 1. Actualizamos el texto en la placa
      textoNombre.innerText = nombre;

      // 2. Limpiamos el contenedor del QR
      contenedorQR.innerHTML = "";

      // 3. Generamos el QR puro (sin textos extra, porque ya están en el diseño de la placa)
      new QRCode(contenedorQR, {
        text: link,
        width: 220,
        height: 220,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });

      // Mostramos el botón de descarga
      document.getElementById('btn-descargar').style.display = 'block';
    }

    function descargarPlaca() {
      const placa = document.getElementById('placa-exportar');
      const nombre = document.getElementById('nombre').value.trim();

      // html2canvas toma una foto del div "placa-exportar"
      // Le ponemos escala 3 para que tenga una resolución excelente para imprenta (300dpi aprox)
      html2canvas(placa, { scale: 3, backgroundColor: null }).then(canvas => {
        const a = document.createElement('a');
        a.href = canvas.toDataURL("image/png");
        a.download = 'Placa_QR_' + nombre.replace(/\s+/g, '_') + '.png';
        
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });
    }
  </script>

</body>
</html>
