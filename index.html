<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Placas QR Pro - Personalizable</title>
  <script src="https://unpkg.com/easyqrcodejs/dist/easy.qrcode.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f4ede2;
      color: #333;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 40px 20px;
      margin: 0;
      flex-wrap: wrap;
    }

    /* Panel de controles (Izquierda) */
    .panel-controles {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
      height: fit-content;
      max-height: 85vh;
      overflow-y: auto;
    }
    
    h2 { color: #2e5a44; margin-top: 0; text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    
    .form-group { margin-bottom: 15px; }
    .form-row { display: flex; gap: 10px; }
    .form-row > div { flex: 1; }
    
    label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #555; text-transform: uppercase; }
    input[type="text"], input[type="file"], input[type="color"] { 
      width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit;
    }
    input[type="color"] { padding: 2px; height: 35px; cursor: pointer; }
    
    button {
      width: 100%; padding: 12px; background-color: #2e5a44; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 15px;
    }
    button:hover { background-color: #203e2f; }
    
    .btn-descargar { background-color: #8b5a2b; display: none; }
    .btn-descargar:hover { background-color: #6b4421; }

    /* Diseño de la Placa Física (Horizontal) */
    .panel-placa {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      top: 40px;
    }

    #placa-exportar {
      background: #ffffff;
      width: 600px; 
      height: 240px; 
      border: 4px solid #2e5a44;
      border-radius: 12px;
      padding: 20px 25px;
      box-sizing: border-box;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      position: relative;
      display: flex;
      flex-direction: row; 
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s ease;
    }

    /* Columna Izquierda (Logo, Textos y Nombre) */
    .placa-izquierda {
      width: 62%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center; /* Centra todo el contenido verticalmente */
      padding-right: 15px;
    }

    /* Modificado: Esto agrupa el logo y los títulos y los centra como un bloque entero */
    .encabezado-izquierdo {
      display: flex;
      flex-direction: row;
      align-items: center;
      width: 100%;
      justify-content: center; /* ESTO CENTRA EL CONJUNTO LOGO + TÍTULOS */
      margin-bottom: 20px;
    }

    #logo-institucion {
      height: 65px; 
      width: auto;
      max-width: 100px;
      object-fit: contain;
      margin-right: 15px; 
    }

    .caja-titulos {
      display: flex;
      flex-direction: column;
      text-align: left; /* Mantiene los títulos alineados rectos junto al logo */
    }

    .caja-titulos h1 {
      font-size: 20px;
      margin: 0;
      color: #111;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .caja-titulos h2 {
      font-size: 14px;
      margin: 4px 0 0 0;
      color: #2e5a44; 
      font-weight: 600;
    }

    .nombre-perfil {
      font-size: 17px;
      color: #222;
      font-weight: bold;
      margin: 0;
      padding-top: 15px;
      border-top: 2px solid #eaeaea;
      width: 100%;
      text-align: center; 
    }

    /* Columna Derecha (Código QR) */
    .placa-derecha {
      width: 35%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-left: 2px dashed #eaeaea;
      padding-left: 15px;
    }

    #qr-container {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      min-height: 140px;
      min-width: 140px;
    }

    .instruccion {
      font-size: 12px;
      font-weight: bold;
      color: #c0392b; 
      margin: 10px 0 0 0;
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="panel-controles">
    <h2>Personalizar Placa QR</h2>
    
    <div class="form-group">
      <label for="link">Enlace (URL del código QR)</label>
      <input type="text" id="link" placeholder="Ej: https://misitio.vercel.app/perfil1.html">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="titulo1">Título Principal</label>
        <input type="text" id="titulo1" value="U.A.A.A.N.">
      </div>
      <div class="form-group">
        <label for="titulo2">Subtítulo</label>
        <input type="text" id="titulo2" value="Ciencias del Suelo">
      </div>
    </div>

    <div class="form-group">
      <label for="nombre">Nombre de la Muestra / Ubicación</label>
      <input type="text" id="nombre" placeholder="Ej: Soto la Marina, Tamaulipas">
    </div>

    <div class="form-group">
      <label for="texto-instruccion">Texto debajo del QR</label>
      <input type="text" id="texto-instruccion" value="Escanea aquí">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="color-institucional">Color Institucional</label>
        <input type="color" id="color-institucional" value="#2e5a44" onchange="actualizarColores()">
      </div>
      <div class="form-group">
        <label for="color-alerta">Color de Instrucción</label>
        <input type="color" id="color-alerta" value="#c0392b" onchange="actualizarColores()">
      </div>
    </div>

    <div class="form-group">
      <label for="logo">Logo de la Institución</label>
      <input type="file" id="logo" accept="image/png, image/jpeg">
    </div>

    <button onclick="generarQR()">1. Previsualizar Placa</button>
    <button id="btn-descargar" class="btn-descargar" onclick="descargarPlaca()">2. Descargar Placa (Alta Resolución)</button>
  </div>

  <div class="panel-placa">
    <p style="margin-top: 0; font-size: 14px; color: #555; font-weight: bold;">Vista Previa en Tiempo Real</p>
    
    <div id="placa-exportar">
      
      <div class="placa-izquierda">
        <div class="encabezado-izquierdo">
          <img id="logo-institucion" src="https://cdn-icons-png.flaticon.com/512/2942/2942784.png" alt="Escudo">
          <div class="caja-titulos">
            <h1 id="vista-titulo1">U.A.A.A.N.</h1>
            <h2 id="vista-titulo2">Ciencias del Suelo</h2>
          </div>
        </div>
        <p class="nombre-perfil" id="vista-nombre">Nombre del Perfil</p>
      </div>

      <div class="placa-derecha">
        <div id="qr-container">
          <span style="color: #aaa; font-size: 12px;">[ Escanea ]</span>
        </div>
        <p class="instruccion" id="vista-instruccion">Escanea aquí</p>
      </div>
      
    </div>
  </div>

  <script>
    // 1. Cambiar el logo en tiempo real
    document.getElementById('logo').addEventListener('change', function(event) {
      if (event.target.files && event.target.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('logo-institucion').src = e.target.result;
        };
        reader.readAsDataURL(event.target.files[0]);
      }
    });

    // 2. Función para actualizar los colores en tiempo real sin tener que recargar el QR
    function actualizarColores() {
      const colorInst = document.getElementById('color-institucional').value;
      const colorAlerta = document.getElementById('color-alerta').value;
      
      document.getElementById('placa-exportar').style.borderColor = colorInst;
      document.getElementById('vista-titulo2').style.color = colorInst;
      document.getElementById('vista-instruccion').style.color = colorAlerta;
    }

    // 3. Generar la placa completa
    function generarQR() {
      const link = document.getElementById('link').value.trim();
      const titulo1 = document.getElementById('titulo1').value.trim() || 'U.A.A.A.N.';
      const titulo2 = document.getElementById('titulo2').value.trim() || 'Ciencias del Suelo';
      const nombre = document.getElementById('nombre').value.trim();
      const instruccion = document.getElementById('texto-instruccion').value.trim() || 'Escanea aquí';
      
      const contenedorQR = document.getElementById('qr-container');

      if (!link || !nombre) {
        alert("Los campos 'Enlace' y 'Nombre de la Muestra' son obligatorios.");
        return;
      }

      document.getElementById('vista-titulo1').innerText = titulo1;
      document.getElementById('vista-titulo2').innerText = titulo2;
      document.getElementById('vista-nombre').innerText = nombre;
      document.getElementById('vista-instruccion').innerText = instruccion;

      actualizarColores();

      contenedorQR.innerHTML = "";
      new QRCode(contenedorQR, {
        text: link,
        width: 140, 
        height: 140,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H 
      });

      document.getElementById('btn-descargar').style.display = 'block';
    }

    // 4. Descargar la placa final
    function descargarPlaca() {
      const placa = document.getElementById('placa-exportar');
      const nombre = document.getElementById('nombre').value.trim();

      html2canvas(placa, { 
        scale: 3, 
        backgroundColor: '#ffffff',
        useCORS: true, 
        logging: false
      }).then(canvas => {
        const a = document.createElement('a');
        a.href = canvas.toDataURL("image/png");
        a.download = 'QR_' + nombre.replace(/\s+/g, '_') + '.png';
        
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });
    }
  </script>

</body>
</html>
